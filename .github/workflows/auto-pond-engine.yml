name: Autonomous Koi Pond Liner & Waterfall Pump Sizing Engine

on:
  schedule:
    - cron: '42 */6 * * *'
  workflow_dispatch:
    inputs:
      custom_pond:
        description: 'Optional Pond Size or Pump Model (e.g. 12x18x3.5 Ft Koi Pond)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  generate-pond-calculators:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Pond Calculators & Ping Search Engines
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          PAGES_PER_RUN: '3'
          CUSTOM_POND: ${{ github.event.inputs.custom_pond || '' }}
        run: |
          python engine/pond_builder.py

      - name: Commit & Push to Trigger GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/published_ponds.json
          if git diff --staged --quiet; then
            echo "No new pond calculator pages to commit."
          else
            git commit -m "chore(pond): auto-publish new pond liner & waterfall GPH calculators"
            git push origin main
          fi
